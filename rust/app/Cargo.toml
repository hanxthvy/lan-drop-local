[package]
name = "lan-drop"
version = "0.1.2"
edition = "2021"
description = "LAN DROP — aplikasi desktop (Tauri). Tanpa Node, tanpa Electron."
license = "MIT"
publish = false

[lib]
name = "lan_drop_app"
path = "src/lib.rs"
# staticlib/cdylib dipakai Android & iOS; rlib untuk desktop.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lan-drop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lan-drop-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Tray dan clipboard hanya ada di desktop; Android memakai WebView sistem.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-clipboard-manager = "2"
