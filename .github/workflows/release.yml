name: Release

# Satu tag (atau tombol Run workflow) -> bundel untuk semua platform.
# Build dijalankan di runner aslinya, bukan cross-compile: NSIS dan .dmg butuh
# toolchain host, dan hasil lintas-arsitektur tidak boleh diklaim teruji.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Token default hanya baca; melampirkan aset ke rilis butuh tulis.
permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            name: windows-x86_64
            rust-target: x86_64-pc-windows-msvc
          # Universal (Intel + Apple Silicon). Runner arm64 tidak tersedia di
          # semua paket, jadi satu job x86_64 yang membangun dua arsitektur.
          # macos-13 sudah dipensiunkan (job menggantung di antrean); label intel
          # terbaru membangun dua arsitektur sekaligus untuk dmg universal.
          - os: macos-15-intel
            name: macos-universal
            rust-target: universal-apple-darwin
            # universal-apple-darwin bukan target rustup; dua arsitektur asli
            # dipasang dulu, lalu bundler yang menggabungkannya jadi satu .dmg.
            rust-targets: x86_64-apple-darwin,aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.rust-targets || matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependensi Linux (webkit2gtk, rpm)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev pkg-config build-essential \
            rpm

      - name: Dependensi macOS (dua arsitektur)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci

      # deb + rpm (Linux), NSIS .exe (Windows), universal .app/.dmg (macOS).
      - name: Bundel
        run: npx tauri build --target ${{ matrix.rust-target }}
        working-directory: rust/app

      # Tag v* -> aset rilis, bukan cuma artifact yang kedaluwarsa.
      - name: Lampirkan ke rilis
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
            rust/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb
            rust/target/${{ matrix.rust-target }}/release/bundle/rpm/*.rpm
            rust/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lan-drop-${{ matrix.name }}
          path: |
            rust/target/${{ matrix.rust-target }}/release/bundle/**
            rust/target/release/bundle/**
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Di level job supaya bisa dipakai `if:` pada langkah tanda tangan.
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android bergantung pada image runner; cmdline-tools
      # resmi lebih panjang tapi tidak bergeser diam-diam.
      - name: Android SDK + NDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" > /dev/null
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "NDK_HOME=$SDK/ndk/26.1.10909125"
            echo "NDK_PATH=$SDK/ndk/26.1.10909125"
          } >> "$GITHUB_ENV"
          {
            echo "$SDK/cmdline-tools/latest/bin"
            echo "$SDK/platform-tools"
            echo "$SDK/build-tools/36.0.0"
          } >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Satu build, tiga berkas: 32-bit (armeabi-v7a + x86), 64-bit
      # (arm64-v8a + x86_64), dan universal. Kunci dari secret; kalau tidak
      # ada, APK tetap dihasilkan tanpa tanda tangan.
      - name: APK (32-bit, 64-bit, universal)
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/release.keystore
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: landrop
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ANDROID_KEY_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > release.keystore
          fi
          bash scripts/android-apks.sh

      - name: Lampirkan ke rilis
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/android/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lan-drop-android
          path: |
            dist/android/*.apk
          if-no-files-found: error
