name: CI

# 322 pemeriksaan lokal yang dulu cuma jalan kalau diingat. Sekarang tiap push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Yang diuji di sini adalah oracle perilaku (server/ Node) dan pemeriksa
  # regresi. Runtime aplikasi sudah tidak menyentuh Node sama sekali.
  # Pemeriksaan yang butuh binary Rust dilewati di sini (SKIP_BINARY=1) karena
  # build LTO butuh waktu lebih lama dari jatah job; job `rust` yang menjalankannya.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --omit=dev tidak dipakai: express/multer di devDependencies adalah
      # oracle yang dibandingkan check:parity.
      - run: npm ci
      - run: npm test
        env:
          SKIP_BINARY: '1'

  # Inti Rust + aplikasi desktop. Keduanya harus dibangun penuh: jendela Tauri
  # memakai webkit2gtk, dan dependensi sistemnya tidak ada di runner default.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Versi dipin: `cargo fmt --check` peka terhadap versi rustfmt, dan
      # toolchain yang bergeser sendiri membuat CI merah tanpa perubahan kode.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Dependensi desktop (webkit2gtk, appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev pkg-config build-essential
      # Manifest di akar workspace tidak punya target sendiri; `--all` wajib.
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      # Peringatan lint adalah bug yang belum kejadian.
      - run: cargo clippy --release --all-targets --manifest-path rust/Cargo.toml -- -D warnings
      - run: cargo test --release --manifest-path rust/Cargo.toml
      # Build kedua crate: CLI/inti dan aplikasi desktop.
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Satu-satunya pemeriksaan yang menjalankan binary hasil build.
      - run: npm run check:desktop
